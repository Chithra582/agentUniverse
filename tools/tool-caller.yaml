name: "tool-caller"
description: "Dispatches external tool execution, API calls, and Python calculations across agent workers."
input_schema:
  type: object
  properties:
    tool_name:
      type: string
      description: "Identifier of the tool component to invoke."
    tool_input:
      type: object
      description: "Input parameters dictionary for the tool."
    timeout:
      type: integer
      description: "Execution timeout limit in seconds."
      default: 60
  required:
    - tool_name
    - tool_input
